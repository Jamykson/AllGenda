spring.application.name=allgenda
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:allgenda}
spring.datasource.username=${DB_USER:allgenda_user}
spring.datasource.password=${DB_PASSWORD:alljgc}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configure um segredo de pelo menos 32 bytes no ambiente.
app.jwt.secret=${JWT_SECRET}

# Imagens anexadas às anotações. O diretório é relativo a allgenda/ quando o backend roda pela task do mise.
app.uploads.dir=${UPLOADS_DIR:uploads}
app.uploads.tamanho-maximo=5MB
app.uploads.maximo-por-anotacao=10
# O servidor recusa o upload antes do controller; a requisição tem uma folga para o restante do formulário.
spring.servlet.multipart.max-file-size=${app.uploads.tamanho-maximo}
spring.servlet.multipart.max-request-size=6MB

# Usuário de teste criado ao iniciar, se ainda não existir. Só com as variáveis DEV_USUARIO_* (definidas no mise.toml).
app.dev.usuario.nome=${DEV_USUARIO_NOME:}
app.dev.usuario.email=${DEV_USUARIO_EMAIL:}
app.dev.usuario.senha=${DEV_USUARIO_SENHA:}

# Assistente de IA da página da aula (API da Anthropic). Sem ANTHROPIC_API_KEY, o back-end sobe e o assistente responde 503.
app.assistente.chave=${ANTHROPIC_API_KEY:}
app.assistente.modelo=${ASSISTENTE_MODELO:claude-sonnet-5-5}
app.assistente.max-tokens=2000
app.assistente.maximo-imagens=20
app.assistente.perguntas-por-hora=30
